<!doctype html>

<meta charset="utf-8">

<title>PREVIEW · EVA</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#13080c;--tx:#fff;--mu:#aa9aa1;--ac:#ff1f1f;--ac2:#ff5a5a;--bd:#46121a;--ok:#22c55e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:"Noto Sans Ethiopic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{max-width:520px;margin:0 auto;padding:14px 14px 92px}
h1{font-size:26px;font-weight:800;letter-spacing:.5px}
h2{font-size:18px;font-weight:800;margin:6px 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 14px;font:inherit;font-size:13px}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer}
.ba{display:grid;grid-template-columns:1fr 1fr;height:120px;position:relative}
.ba.big{height:260px;border-radius:16px;overflow:hidden}
.ba>div{display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700;color:#fff;background-size:cover;background-position:center}
.ba .b{background-color:#8b8aa0}
.meta{padding:10px}
.meta b{display:block;font-size:14px;margin-bottom:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-weight:800;color:var(--ac2)}
.tag{font-size:11px;color:var(--mu)}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;font-size:15px;background:var(--ac);color:#fff;margin-top:10px}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.5}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.mu{color:var(--mu);font-size:13px;line-height:1.6}
.ptxt{background:var(--bg);border:1px dashed var(--ac);border-radius:12px;padding:12px;font-size:14px;line-height:1.7;margin-top:10px;white-space:pre-wrap}
.back{border:0;background:none;color:var(--ac);font:inherit;font-weight:700;padding:4px 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;padding:10px 0}
nav button.on{color:var(--ac);font-weight:800}
nav span{display:block;font-size:20px}
.sheet{position:fixed;inset:0;background:rgba(10,5,25,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.seg{display:flex;gap:8px;margin:10px 0}
.seg button{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px;font:inherit;font-weight:700}
.seg button.on{border-color:var(--ac);outline:2px solid var(--ac)}
input{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;font:inherit;margin-top:6px}
.acct{font-size:20px;font-weight:800;letter-spacing:1px;margin:4px 0}
.st{font-size:11px;font-weight:800;border-radius:8px;padding:3px 8px}
.st.p{background:#fde68a;color:#78350f}.st.o{background:#bbf7d0;color:#14532d}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:30}
.lang{display:flex;border:1px solid var(--bd);border-radius:20px;overflow:hidden;background:var(--card)}.lang button{border:0;background:none;color:var(--mu);font:inherit;font-size:12px;font-weight:700;padding:6px 11px}.lang button.on{background:var(--ac);color:#fff}
.adbox{height:180px;border-radius:14px;background:repeating-linear-gradient(45deg,var(--card),var(--card) 10px,var(--bd) 10px,var(--bd) 20px);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--mu);margin:10px 0}
html{background:#000}body{background:#000}
.logo-img{height:44px;width:auto;max-width:55%;display:block;filter:drop-shadow(0 0 8px rgba(255,31,31,.5))}
.logo{font-weight:900;font-style:italic;font-size:30px;letter-spacing:1px;color:var(--ac);text-shadow:0 0 12px rgba(255,31,31,.7),0 2px 0 #6a0000}
.card,.box,.chip,.lang,.seg button,input{border-color:var(--bd);box-shadow:0 0 12px rgba(255,31,31,.1)}
.chip{border-color:var(--ac)}.chips button.on,.lang button.on{box-shadow:0 0 10px rgba(255,31,31,.6)}
.btn{background:linear-gradient(#ff2d2d,#c30000);box-shadow:0 0 14px rgba(255,31,31,.45)}.btn.alt{background:transparent;box-shadow:none;border-color:var(--ac)}
nav{background:#0d0609;border-top-color:var(--bd)}nav button.on{color:var(--ac)}
nav button.plus{flex:none;width:54px;height:54px;padding:0;margin:-22px 4px 0;border-radius:50%;font-size:32px;color:#fff;background:linear-gradient(#ff2d2d,#b00000);box-shadow:0 0 18px rgba(255,31,31,.8)}
.ico{border:0;background:none;color:var(--tx);font-size:22px}
.av{width:64px;height:64px;border-radius:50%;border:2px solid var(--ac);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:var(--ac);box-shadow:0 0 14px rgba(255,31,31,.5)}
.bar{height:8px;border-radius:8px;background:#2a1016}.bar i{display:block;height:100%;border-radius:8px;background:var(--ac)}
.ck{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}.ck span{width:22px;height:22px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:13px}

nav{background:#000;border-top:1px solid var(--ac);box-shadow:0 -2px 14px rgba(255,31,31,.45)}
nav button{color:#8fa3d8;font-weight:700;font-size:13px}
nav button.on{color:var(--ac);font-weight:800}
nav span{display:flex;justify-content:center;margin-bottom:3px}
nav span svg{width:26px;height:26px}
nav button.plus{display:flex;align-items:center;justify-content:center;width:62px;height:62px;margin:-2px 4px 0;transform:translateY(4px);background:radial-gradient(circle at 50% 30%,#ff4a4a,#d40000 70%);box-shadow:0 0 20px rgba(255,31,31,.85);border:2px solid rgba(255,255,255,.25)}

.lg{position:relative}
.lgb{display:flex;align-items:center;gap:8px;border:1px solid var(--ac);background:var(--card);color:#fff;border-radius:22px;padding:8px 14px;font:inherit;font-weight:800;font-size:14px;box-shadow:0 0 12px rgba(255,31,31,.4)}
.fl{font-size:20px;line-height:1}
.lgm{position:absolute;right:0;top:calc(100% + 6px);z-index:15;background:#000;border:1px solid var(--ac);border-radius:14px;padding:4px;min-width:140px;box-shadow:0 0 16px rgba(255,31,31,.45)}
.lgm button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#fff;font:inherit;font-size:14px;font-weight:600;padding:9px 10px;border-radius:10px}
.lgm button.on{background:var(--ac)}
.chip .gi{width:20px;height:20px;vertical-align:-4px;margin-right:2px;filter:drop-shadow(0 0 4px rgba(255,31,31,.6))}
.lk{display:inline-flex;align-items:center}
.lock{width:22px;height:22px;margin-right:6px;filter:drop-shadow(0 0 4px rgba(255,31,31,.55))}
.okt{color:#22c55e;font-weight:800;font-size:15px}
.grid .card{border:1px solid var(--ac);border-radius:18px;background:var(--card);box-shadow:0 0 12px rgba(255,31,31,.4)}
.lk .gi{width:22px;height:22px;margin-right:6px;filter:drop-shadow(0 0 4px rgba(255,31,31,.6))}
.prow{display:flex;align-items:center;gap:14px;padding:12px;margin-bottom:10px;background:var(--card);border:1px solid var(--ac);border-radius:18px;box-shadow:0 0 12px rgba(255,31,31,.35);cursor:pointer}
.pic{width:48px;height:48px;border-radius:50%;background:#000;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;flex:none}
.pic svg{width:24px;height:24px}
.ptx b{display:block;font-size:16px}.ptx small{color:var(--mu);font-size:13px}
.dep .chips button,.dep input,.dep .seg button{border:1px solid #38bdf8;box-shadow:0 0 10px rgba(56,189,248,.35)}
.dep .chips button.on{border-color:#38bdf8;box-shadow:0 0 12px rgba(56,189,248,.7)}
.dep .seg button.on{border-color:var(--ac);outline:2px solid var(--ac);box-shadow:0 0 12px rgba(255,31,31,.55)}
.wal .box{border:1px solid #38bdf8;box-shadow:0 0 12px rgba(56,189,248,.35)}
.wal .box.bal{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:18px 16px;border:1px solid var(--ac);background:linear-gradient(120deg,#160306 0%,#3d050c 60%,#1a0408 100%);box-shadow:0 0 16px rgba(255,31,31,.5)}
.wal .box.bal::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,70,70,.28) 39%,transparent 40.5%,transparent 52%,rgba(255,70,70,.18) 53%,transparent 54%,transparent 68%,rgba(255,70,70,.2) 69%,transparent 70%)}
.wal .box.bal>*{position:relative}
.balv{font-size:36px;font-weight:800;color:#fff;line-height:1.2}
.balic{width:60px;height:60px;border-radius:16px;border:1px solid var(--ac);background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(255,31,31,.5)}
.balic svg{width:34px;height:34px;filter:drop-shadow(0 0 6px rgba(255,31,31,.7))}
.stats{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.stt{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--mu);line-height:1.2}
.stt svg{width:14px;height:14px}
.cart{font-style:normal;font-size:13px;line-height:1}
.wi{width:20px;height:20px;vertical-align:-4px;margin-right:4px;filter:drop-shadow(0 0 4px rgba(255,31,31,.6))}
.lkb{cursor:pointer;padding:4px 6px;margin:-4px -6px}
.lkb.on{color:#ff6b6b}
.lkb svg{transition:transform .15s}.lkb:active svg{transform:scale(1.35)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:14px 8px;font:inherit;font-size:14px;font-weight:600;text-align:center}
.opt.on{background:var(--ac);border-color:var(--ac);box-shadow:0 0 12px rgba(255,31,31,.6)}
.chips button.rnd{border-color:var(--ac);box-shadow:0 0 10px rgba(255,31,31,.45)}
.lsh{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.lsb{width:100%;max-width:520px;background:#000;border:1px solid var(--ac);border-radius:20px 20px 0 0;padding:16px 16px 24px;box-shadow:0 0 20px rgba(255,31,31,.5)}
.lsb button{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--bd);background:var(--card);color:#fff;font:inherit;font-size:16px;font-weight:600;padding:13px 14px;border-radius:14px;margin-top:8px}
.lsb button.on{border-color:var(--ac);background:var(--ac)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{position:relative;border:1px solid var(--ac);border-radius:18px;background:var(--card);box-shadow:0 0 12px rgba(255,31,31,.35);overflow:hidden;cursor:pointer}
.pimg,.pbig{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pimg{aspect-ratio:3/4}.pbig{aspect-ratio:3/4;width:100%;border-radius:18px;border:1px solid var(--ac);box-shadow:0 0 14px rgba(255,31,31,.4)}
.pimg img,.pbig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcam svg{width:46px;height:46px;opacity:.45}
.pbadge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.75);border:1px solid var(--ac);color:#fff;border-radius:12px;padding:3px 9px;font-size:11px;font-weight:700}
.pt{padding:10px;font-weight:700;font-size:14px}
.tpls{display:flex;flex-wrap:wrap;gap:8px}
.tpls button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600}
.tpls button.on{background:var(--ac);border-color:var(--ac);box-shadow:0 0 10px rgba(255,31,31,.55)}
/* ጥርት ያለ ድንበር: ብዥ ያለ ቀይ ብርሃን (glow) ተወግዷል */
.card,.box,.chip,.lgb,.lgm,.prow,.pc,.opt,.opt.on,.tpls button,.tpls button.on,.lsb,.pbig,.pbadge,input,select,textarea,
.wal .box,.wal .box.bal,.dep .chips button,.dep .chips button.on,.dep input,.dep .seg button,.dep .seg button.on,
.grid .card,.chips button,.chips button.rnd,.balic,.lang,.seg button,.lkb,nav{box-shadow:none !important}
.logo-img{filter:none !important}
.pimg.tim{aspect-ratio:1/1}
.pc.tc.on{border:2px solid var(--ac);background:var(--ac)}
.pbig.tim{aspect-ratio:1/1}
.admbar{display:flex;justify-content:space-between;align-items:center;background:#1a0408;border:1px solid var(--ac);border-radius:12px;padding:6px 12px;margin-bottom:10px;font-size:13px}
.admbar button{border:1px solid var(--ac);background:#000;color:#fff;border-radius:10px;padding:4px 10px;margin-left:6px;font:inherit;font-size:12px}
.aedit{position:absolute;top:8px;right:8px;z-index:3;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.85);border:1px solid var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.card,.pc{position:relative}
.al{display:block;font-size:13px;color:var(--mu);margin-top:10px}
.ai{width:100%;background:var(--card);border:1px solid var(--bd);color:#fff;border-radius:12px;padding:12px;font:inherit;margin:4px 0 6px}
.ac{display:flex;align-items:center;margin:12px 0;font-size:14px}.ac input{width:auto;margin:0 8px 0 0}
.ip{position:relative;margin:6px 0}.ip img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--ac)}
.adx{border:1px solid var(--ac);background:#000;color:#fff;border-radius:10px;padding:6px 10px;font:inherit}
.ip .adx{position:absolute;top:8px;right:8px}
.th{display:block;width:100%;height:100%;background-size:cover;background-position:center}
.pic{overflow:hidden}
.logo-img{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.tier{font-size:11px;font-weight:800;padding:3px 9px;border-radius:12px;border:1px solid;white-space:nowrap}
.t-basic{color:#8fa3d8;border-color:#8fa3d8;background:rgba(143,163,216,.12)}
.t-standard{color:#38bdf8;border-color:#38bdf8;background:rgba(56,189,248,.12)}
.t-premium{color:#fbbf24;border-color:#fbbf24;background:rgba(251,191,36,.14)}
</style>

 if(k==='p')items=POSES.filter(function(p){return !p.g||p.g===g}).map(function(p){return {i:p.id,e:p.e,t:p.t,img:p.img,c:p.c}});

function pickImg(inp,k){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=800,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ed.d[k]=c.toDataURL('image/jpeg',.82);render()};im.src=r.result};r.readAsDataURL(f)}

function editForm(){var d=ed.d,b='',ti;
 if(ed.k==='prod'){ti=ed.n?'＋ አዲስ prompt':'✎ Edit prompt';
  b=fi('Title (English)','e')+fi('ርዕስ (አማርኛ)','t')+fs('Category','c',CATS.filter(function(c){return c[0]!=='all'}).map(function(c){return [c[0],(CE[c[0]]||c[1])]}))+fi('Price (birr)','p','number')+fs('ለማን','sx',[['','ሁሉም'],['f','♀ ሴት'],['m','♂ ወንድ']])+ft('Prompt (English)','txt')+ftier()+fimg('Before photo (ከፊት)','b')+fimg('After photo (ከኋላ)','a')}
 else{var k=ed.sk;ti=(ed.n?'＋ አዲስ ':'✎ ')+({h:'ፀጉር',o:'አለባበስ',t:'ታቱ',p:'ፖዝ'})[k]+' ('+(ed.sg==='f'?'♀':'♂')+')';
  b=fi('Name (English)','e')+fi('ስም (አማርኛ)','t')+(k==='p'?ft('Tip (English)','te')+ft('ምክር (አማርኛ)','ta'):ft('Prompt phrase (English) — e.g. "a chic bob haircut"','ph'))+fimg('Sample photo (ናሙና ፎቶ)','img')}
 return '<button class="back" onclick="adCancel()">'+t('back')+'</button><h2>'+ti+'</h2>'+b+'<button class="btn" onclick="adSave()">💾 Save</button>'+(ed.n?'':'<button class="btn alt" onclick="adDel()">'+(ed.cd?'⚠ እንደገና ንካ ለመሰረዝ':'🗑 Delete')+'</button>')}

 var pr=Math.max(0,parseInt(d.p,10)||0),o;
 if(ed.n){var id=P.reduce(function(m,x){return Math.max(m,x.id)},0)+1;o={id:id,s:0,l:0,v:0,hot:0,g:TG[id%TG.length]};P.push(o)}else o=byId(ed.id);
 o.e=d.e.trim();o.t=(d.t||d.e).trim();o.c=d.c;o.p=pr;o.txt=d.txt.trim();o.tier=d.tier||'basic';

 if(k==='p'){if(ed.n){var id=POSES.reduce(function(m,x){return Math.max(m,x.id)},0)+1;POSES.push({id:id,g:g,e:d.e.trim(),t:(d.t||d.e).trim(),te:d.te,ta:d.ta||d.te,img:d.img,c:TG[id%TG.length]})}else{var p=POSES.filter(function(x){return x.id===ed.id})[0];p.e=d.e.trim();p.t=(d.t||d.e).trim();p.te=d.te;p.ta=d.ta||d.te;p.img=d.img}}
 else{if(!d.ph.trim()){toast('Prompt ያስፈልጋል');return false}var it=[d.e.trim(),(d.t||d.e).trim(),d.ph.trim(),d.img],arr=getArr(k,g);if(ed.n)arr.push(it);else arr[ed.idx]=it}return true}

 else if(ed.sk==='p')POSES=POSES.filter(function(x){return x.id!==ed.id});else getArr(ed.sk,ed.sg).splice(ed.idx,1);

/* ===== SERVER ===== */
var TOKEN='',UID='',busy=false;
function api(n,d){return fetch('/api/'+n,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify(d||{})}).then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||'err');e.status=r.status;throw e}return j})})}
function errMsg(e){if(e.status===409)return t('tUsed');if(/low balance/.test(e.message))return t('tLow');return t('tErr')}
function call(n,d,ok){
 if(n==='useCredit'||n==='adUnlock'){if(n==='useCredit')S.credits--;if(S.unlocked.indexOf(d.pid)<0)S.unlocked.push(d.pid);if(ok)ok({});render();return}
 if(n==='buyWithWallet'){var q=byId(d.pid);S.wallet-=q.p;if(S.unlocked.indexOf(d.pid)<0)S.unlocked.push(d.pid);if(ok)ok({});render();return}
 if(n==='getPrompt'){if(ok)ok({txt:byId(d.pid).txt});return}
 if(n==='submitPayment'){if(d.kind==='deposit')S.deps.unshift({amt:d.amount,m:d.method,ref:d.ref,st:'p'});else S.pending.push({pid:d.pid,m:d.method,ref:d.ref,st:'p'});if(ok)ok({});render();return}}
function sync(){return;if(busy)return;busy=true;api('me').then(function(r){var u=r.user;S.uid=UID;S.credits=u.credits;S.wallet=u.wallet;S.unlocked=u.unlocked;S.invited=u.invited;S.tx=r.tx;
 var pe=[],de=[];r.pay.sort(function(a,b){return b.ts-a.ts}).forEach(function(x){if(x.status==='rejected')return;var st=x.status==='approved'?'o':'p';if(x.kind==='deposit')de.push({amt:x.amount,m:x.method,ref:x.ref,st:st});else pe.push({pid:x.pid,m:x.method,ref:x.ref,st:st})});S.pending=pe;S.deps=de;busy=false;if(!document.activeElement||document.activeElement.tagName!=='INPUT')render()}).catch(function(){busy=false})}
function boot(){S.credits=5;S.wallet=0;S.unlocked=[];S.pending=[];S.deps=[];S.tx=[];S.invited=0;S.uid='preview'}
boot();
render();
