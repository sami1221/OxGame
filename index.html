<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>6 ወር የእንግሊዝኛ ጉዞ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B130F;
    --surface:#2A1D15;
    --surface-2:#36261B;
    --gold:#D7A052;
    --gold-soft:rgba(215,160,82,0.16);
    --green:#5C8A6A;
    --green-soft:rgba(92,138,106,0.18);
    --rust:#B6552C;
    --text:#F2E8DA;
    --text-muted:#A8927E;
    --line:rgba(215,160,82,0.14);
    --radius:18px;
    --display:'Noto Serif Ethiopic', serif;
    --body:'Noto Sans Ethiopic', sans-serif;
    --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent;}
  body{min-height:100vh;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px 10px;
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, rgba(27,19,15,0));
  }
  .topbar .brand{display:flex;align-items:center;gap:8px;}
  .topbar .brand-mark{font-size:18px;}
  .topbar .brand-name{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.2px;}
  .chip{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;font-family:var(--mono);font-size:12px;color:var(--gold);
  }

  main{flex:1;padding:0 18px 110px;}

  /* ---------- Hero / journey path ---------- */
  .hero{padding:6px 0 18px;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin:0 0 6px;}
  .hero h1{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.35;margin:0 0 18px;color:var(--text);}
  .hero h1 span{color:var(--gold);}

  .path-track{position:relative;height:56px;margin:0 2px 16px;}
  .path-line{position:absolute;top:18px;left:18px;right:18px;height:3px;background:var(--surface-2);border-radius:3px;}
  .path-fill{position:absolute;top:18px;left:18px;height:3px;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:3px;transition:width .6s ease;}
  .path-nodes{position:relative;display:flex;justify-content:space-between;align-items:flex-start;}
  .path-node{
    width:36px;display:flex;flex-direction:column;align-items:center;gap:6px;
    background:none;border:none;color:var(--text-muted);font-family:var(--mono);font-size:11px;padding:0;cursor:pointer;
  }
  .path-node .dot{
    width:14px;height:14px;border-radius:50%;background:var(--surface-2);
    border:2px solid var(--surface-2);
  }
  .path-node.done .dot{background:var(--green);border-color:var(--green);}
  .path-node.current .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);}
  .path-node.current{color:var(--gold);}

  .quote{
    font-style:italic;font-size:14px;color:var(--text-muted);
    border-right:2px solid var(--gold);padding-right:12px;margin:0;line-height:1.6;
  }

  /* ---------- Cards ---------- */
  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px;margin-bottom:16px;
  }
  .card h2{font-family:var(--display);font-size:17px;font-weight:600;margin:0 0 4px;}
  .card .sub{font-size:12.5px;color:var(--text-muted);margin:0 0 14px;}

  .tasklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .task{
    display:flex;align-items:center;gap:12px;
    background:var(--surface-2);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;cursor:pointer;transition:background .2s,border-color .2s;
  }
  .task.checked{background:var(--green-soft);border-color:var(--green);}
  .task .box{
    width:22px;height:22px;border-radius:7px;flex:none;
    border:2px solid var(--text-muted);display:flex;align-items:center;justify-content:center;
    font-size:13px;color:transparent;transition:all .15s;
  }
  .task.checked .box{background:var(--green);border-color:var(--green);color:#10160F;}
  .task .icon{font-size:18px;flex:none;}
  .task .info{flex:1;min-width:0;}
  .task .label{font-weight:600;font-size:14px;}
  .task .detail{font-size:12px;color:var(--text-muted);margin-top:1px;}
  .day-status{
    margin-top:12px;text-align:center;font-family:var(--mono);font-size:12.5px;
    color:var(--text-muted);
  }
  .day-status.complete{color:var(--green);}

  /* ---------- Roadmap accordion ---------- */
  .roadmap-title{font-family:var(--display);font-size:17px;font-weight:600;margin:6px 0 12px 2px;}
  .month-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:10px;overflow:hidden;
  }
  .month-head{
    display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;
    color:var(--text);padding:14px 16px;cursor:pointer;text-align:right;font-family:var(--body);
  }
  .month-num{
    font-family:var(--mono);font-size:12px;color:var(--gold);background:var(--gold-soft);
    border-radius:8px;padding:5px 8px;flex:none;
  }
  .month-head .mh-text{flex:1;min-width:0;}
  .month-head .mh-title{font-weight:700;font-size:14.5px;}
  .month-head .mh-range{font-size:11.5px;color:var(--text-muted);font-family:var(--mono);margin-top:2px;}
  .month-head .chevron{flex:none;color:var(--text-muted);transition:transform .25s;font-size:13px;}
  .month-card.open .chevron{transform:rotate(180deg);}
  .month-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .month-body-inner{padding:0 16px 16px;}
  .month-body ul{margin:0 0 10px;padding-right:18px;display:flex;flex-direction:column;gap:6px;}
  .month-body li{font-size:13.5px;line-height:1.55;}
  .milestone{
    font-size:12.5px;background:var(--gold-soft);color:var(--gold);
    border-radius:10px;padding:8px 10px;line-height:1.5;
  }

  /* ---------- Skills view ---------- */
  .skill-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 16px;scrollbar-width:none;}
  .skill-tabs::-webkit-scrollbar{display:none;}
  .skill-tab{
    flex:none;display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--line);color:var(--text-muted);
    border-radius:999px;padding:9px 14px;font-size:13px;font-family:var(--body);font-weight:600;cursor:pointer;
  }
  .skill-tab.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);}

  .skill-panel .panel-title{font-family:var(--display);font-size:18px;font-weight:600;margin:0 0 4px;}
  .skill-panel .panel-sub{font-size:13px;color:var(--text-muted);margin:0 0 16px;line-height:1.6;}
  .tip-list{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:10px;}
  .tip-list li{
    display:flex;gap:10px;font-size:13.5px;line-height:1.6;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  }
  .tip-list li .num{font-family:var(--mono);color:var(--gold);flex:none;}
  .res-title{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-family:var(--mono);margin:0 0 10px;}
  .res-list{display:flex;flex-direction:column;gap:8px;}
  .res-link{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;color:var(--text);text-decoration:none;font-size:13.5px;font-weight:600;
  }
  .res-link .arrow{color:var(--gold);font-family:var(--mono);}

  /* ---------- Views ---------- */
  .view{display:none;}
  .view.active{display:block;}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed;bottom:0;left:0;right:0;
    max-width:480px;margin:0 auto;
    display:flex;background:var(--surface);border-top:1px solid var(--line);
    padding:10px 18px calc(10px + env(safe-area-inset-bottom));
    gap:8px;z-index:30;
  }
  .nav-btn{
    flex:1;background:none;border:none;color:var(--text-muted);
    display:flex;flex-direction:column;align-items:center;gap:4px;
    font-family:var(--body);font-size:11.5px;font-weight:600;padding:6px 0;border-radius:12px;cursor:pointer;
  }
  .nav-btn .nicon{font-size:18px;}
  .nav-btn.active{color:var(--gold);background:var(--gold-soft);}

  .reset-row{text-align:center;padding:6px 0 4px;}
  .reset-link{font-size:11.5px;color:var(--text-muted);background:none;border:none;text-decoration:underline;font-family:var(--body);cursor:pointer;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand"><span class="brand-mark">☕</span><span class="brand-name">6 ወር ጉዞ</span></div>
    <div class="chip" id="dayChip">ቀን 1/180</div>
  </div>

  <main>

    <!-- ============ HOME VIEW ============ -->
    <section class="view active" id="view-home">
      <div class="hero">
        <p class="eyebrow">English in 6 months</p>
        <h1>እንግሊዝኛህን <span>በየቀኑ</span> ትንሽ ትንሽ እየገነባህ ነው።</h1>

        <div class="path-track">
          <div class="path-line"></div>
          <div class="path-fill" id="pathFill" style="width:0%"></div>
          <div class="path-nodes" id="pathNodes"></div>
        </div>

        <p class="quote" id="quoteText"></p>
      </div>

      <div class="card">
        <h2>የዛሬ ስራ</h2>
        <p class="sub">5ቱንም ስታጠናቅቅ ቀንህ ይሟላል እና streak ይጨምራል።</p>
        <ul class="tasklist" id="taskList"></ul>
        <p class="day-status" id="dayStatus"></p>
      </div>

      <h2 class="roadmap-title">የ6 ወር ፕላን</h2>
      <div id="roadmap"></div>

      <div class="reset-row">
        <button class="reset-link" id="resetBtn">እድገትን ዳግም ጀምር</button>
      </div>
    </section>

    <!-- ============ SKILLS VIEW ============ -->
    <section class="view" id="view-skills">
      <div class="skill-tabs" id="skillTabs"></div>
      <div class="skill-panel" id="skillPanel"></div>
    </section>

  </main>

  <nav class="bottomnav">
    <button class="nav-btn active" data-view="home"><span class="nicon">🗺️</span>ጉዞ</button>
    <button class="nav-btn" data-view="skills"><span class="nicon">🎯</span>ክህሎቶች</button>
  </nav>

</div>

<script>
(function(){
  "use strict";

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  var memoryStore = {};

  if(tg){
    try{ tg.ready(); tg.expand(); }catch(e){}
    try{ tg.setHeaderColor && tg.setHeaderColor('#1B130F'); }catch(e){}
    try{ tg.setBackgroundColor && tg.setBackgroundColor('#1B130F'); }catch(e){}
  }

  function csGet(key){
    return new Promise(function(resolve){
      if(tg && tg.CloudStorage){
        tg.CloudStorage.getItem(key, function(err, value){ resolve(err ? null : value); });
      } else {
        resolve(memoryStore[key] || null);
      }
    });
  }
  function csSet(key, value){
    return new Promise(function(resolve){
      if(tg && tg.CloudStorage){
        tg.CloudStorage.setItem(key, value, function(err, ok){ resolve(!err); });
      } else {
        memoryStore[key] = value; resolve(true);
      }
    });
  }
  function haptic(){ if(tg && tg.HapticFeedback){ try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){} } }
  function openLink(url){ if(tg && tg.openLink){ try{ tg.openLink(url); return; }catch(e){} } window.open(url,'_blank'); }
  function confirmDialog(msg, cb){
    if(tg && tg.showConfirm){ try{ tg.showConfirm(msg, cb); return; }catch(e){} }
    cb(window.confirm(msg));
  }

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function toDateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function dateFromKey(k){ var p=k.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }

  var TASKS = [
    {id:'listen', label:'ማዳመጥ', detail:'20-30 ደቂቃ የእንግሊዝኛ ድምጽ ስማ', icon:'🎧'},
    {id:'speak',  label:'መናገር', detail:'10-15 ደቂቃ ጮክ ብለህ ተናገር', icon:'🗣️'},
    {id:'read',   label:'ማንበብ', detail:'15-20 ደቂቃ ቀላል ጽሑፍ አንብብ', icon:'📖'},
    {id:'write',  label:'መጻፍ', detail:'5-10 ዓረፍተ ነገሮች ጻፍ', icon:'✍️'},
    {id:'vocab',  label:'ቃላት/ሰዋስው', detail:'15 ደቂቃ አዳዲስ ቃላት ተማር', icon:'🧩'}
  ];

  var QUOTES = [
    "ቋንቋ የሚገነባው በቀን ተቀን ልምምድ ነው እንጂ በአንዴ አይደለም።",
    "ስህተት መስራት የመማር አካል ነው እንጂ እንቅፋት አይደለም።",
    "ትንሽ በተከታታይ ይበልጣል ትልቅ በአንዴ ከማድረግ።",
    "በራስህ ፍጥነት ሂድ ግን አታቁም።",
    "እያንዳንዱ ቃል የምትለማው ወደ ግብህ የሚያቀርብህ ድልድይ ነው።",
    "ዛሬ የተወው ትንሽ ልምምድ ነገ የሚታይ ለውጥ ይፈጥራል።"
  ];

  var MONTHS = [
    {n:1, title:'መሰረት', range:'ቀን 1–30',
      focus:[
        'መሰረታዊ ድምፆችን (pronunciation) እና አጠራርን ተለማመድ',
        '1000 መሰረታዊ ቃላት እና ቀላል ዓረፍተ ነገሮችን ተማር',
        'Simple Present Tense ላይ አተኩር',
        'በቀን 20 ደቂቃ ለጀማሪ የተደረገ ድምጽ አድምጥ'
      ],
      milestone:'ግብ፦ ራስህን በቀላል ዓረፍተ ነገር ማስተዋወቅ መቻል።'},
    {n:2, title:'ግንባታ', range:'ቀን 31–60',
      focus:[
        'Past እና Future Tense ተማር',
        'የቀን ተቀን መነጋገሪያ ሐረጎችን (everyday phrases) ለማድ',
        'በቀን ቢያንስ 3 ዓረፍተ ነገር ዳይሪ ጻፍ',
        'ለጀማሪ የተደረጉ ፖድካስቶችን ለ30 ደቂቃ አድምጥ'
      ],
      milestone:'ግብ፦ ስለ ቀንህ እና እቅድህ በቀላል እንግሊዝኛ መንገር መቻል።'},
    {n:3, title:'መለማመድ', range:'ቀን 61–90',
      focus:[
        'ከቋንቋ ጓደኛ (language partner) ጋር መነጋገር ጀምር',
        'ፊልም/ሲሪዝ በእንግሊዝኛ ሰብ-ታይትል መከታተል',
        'ቀላል ታሪኮችን (graded readers) level 1 አንብብ',
        'ቃላት ዝርዝርህን ወደ 2000 አሳድግ'
      ],
      milestone:'ግብ፦ ለ5 ደቂቃ ያለማቋረጥ በእንግሊዝኛ መነጋገር መቻል።'},
    {n:4, title:'ጥልቀት', range:'ቀን 91–120',
      focus:[
        'Conditionals እና Perfect Tense ተማር',
        'በተፈጥሮ ፍጥነት (native speed) የሚነገሩ ፖድካስቶችን አድምጥ',
        'አጫጭር ድርሰቶችን (paragraphs) መጻፍ ጀምር',
        'አጫጭር ዜናዎችን እና ጽሑፎችን አንብብ'
      ],
      milestone:'ግብ፦ የራስህን አስተያየት በ3-4 ዓረፍተ ነገር ማስፈር መቻል።'},
    {n:5, title:'ፍሰት', range:'ቀን 121–150',
      focus:[
        'በሳምንት ቢያንስ 3 ጊዜ ትክክለኛ ንግግር (real conversation) አድርግ',
        'ፊልም ያለ ሰብ-ታይትል ለመከታተል ሞክር',
        'ድርሰት (essay) ለመጻፍ ሞክር',
        'ዜናዎችን በመደበኛነት አንብብ'
      ],
      milestone:'ግብ፦ ያልተዘጋጁ ርዕሶችን ለ2-3 ደቂቃ መናገር መቻል።'},
    {n:6, title:'ብስለት', range:'ቀን 151–180',
      focus:[
        'ሙሉ ቀን (one full day) በእንግሊዝኛ ብቻ ለማሳለፍ ሞክር',
        'አንድ ቀላል ልብወለድ (novel) ማንበብ ጀምር',
        'የፊት ለፊት ንግግር (mock conversation) ለማድ',
        'የተማርከውን ሁሉ መርምር እና ድክመትህን አጠናክር'
      ],
      milestone:'ግብ፦ በራስ መተማመን ስለ ራስህ፣ ስራህ እና አስተያየትህ መግለጽ መቻል።'}
  ];

  var SKILLS = {
    listen:{icon:'🎧', title:'ማዳመጥ', sub:'ጆሮህን ለእንግሊዝኛ ድምጽ፣ ፍጥነት እና ዜማ ማላመድ ነው ግቡ።',
      tips:[
        'በቀን 20-60 ደቂቃ አድምጥ፤ ቀስ በቀስ ፍጥነቱን ጨምር',
        'መጀመሪያ ለጀማሪ የተደረጉ ይዘቶችን ምረጥ',
        'የምትሰማውን ቃላት ጮክ ብለህ ድገም (shadowing ይባላል)'
      ],
      resources:[
        {name:'BBC Learning English', url:'https://www.bbc.co.uk/learningenglish'},
        {name:'VOA Learning English', url:'https://learningenglish.voanews.com'},
        {name:'English with Lucy — YouTube', url:'https://www.youtube.com/@EnglishwithLucy'}
      ]},
    speak:{icon:'🗣️', title:'መናገር', sub:'መነጋገር በመነጋገር ይማማራል — ስህተት መስራትን ፍራ።',
      tips:[
        'በመስታወት ፊት ብቻህን ስለ ቀንህ ተናገር',
        'ከጓደኛ ጋር በሳምንት 2-3 ጊዜ በእንግሊዝኛ ተግባባ',
        'ስህተት ስለሰራህ አትፍራ — መነጋገር ራሱ ልምምድ ነው'
      ],
      resources:[
        {name:'HelloTalk', url:'https://www.hellotalk.com'},
        {name:'Tandem', url:'https://www.tandem.net'}
      ]},
    read:{icon:'📖', title:'ማንበብ', sub:'ቃላትን በዐውድ (context) ውስጥ ማየት ትዝታህ ላይ ይቀርጻል።',
      tips:[
        'በደረጅህ ደረጃ ቀላል ታሪኮችን (graded readers) አንብብ',
        'በቀላል ደረጄ የተደረጉ ዜናዎችን ተጠቀም',
        'የማታውቀውን ቃል ስትገናኝ ገምተህ ቀጥል፣ አትቆም'
      ],
      resources:[
        {name:'News in Levels', url:'https://www.newsinlevels.com'}
      ]},
    write:{icon:'✍️', title:'መጻፍ', sub:'መጻፍ ያሰብከውን አደራጅተህ የምታስፈር ጊዜ ነው።',
      tips:[
        'በቀን ትንሽ diary ጻፍ — ስህተት ቢኖርበት ችግር የለውም',
        'የተማርካቸውን አዳዲስ ቃላት በዓረፍተ ነገር ተጠቀም',
        'የጻፍከውን ድጋሚ አርም (Grammarly ወይም AI መጠቀም ትችላለህ)'
      ],
      resources:[
        {name:'Grammarly', url:'https://www.grammarly.com'}
      ]},
    vocab:{icon:'🧩', title:'ቃላት/ሰዋስው', sub:'ቃላት እና ሰዋስው የቤቱ ግድግዳና መሰረት ናቸው።',
      tips:[
        'በቀን 15-20 ደቂቃ flashcard (Anki/Duolingo) ተጠቀም',
        'አንድ የሰዋስው መጽሐፍ (e.g. English Grammar in Use) ይዘህ ቀስ በቀስ ስራ',
        'አዳዲስ ቃላትን በራስህ ዓረፍተ ነገር ውስጥ ተጠቅመህ አስታውስ'
      ],
      resources:[
        {name:'Duolingo', url:'https://www.duolingo.com'}
      ]}
  };

  var state = { startDate:null, progress:{} };
  var openMonth = null;
  var activeSkill = 'listen';

  function dayNumber(){
    var start = dateFromKey(state.startDate);
    var today = dateFromKey(toDateKey(new Date()));
    var diff = Math.round((today - start) / 86400000) + 1;
    return Math.min(180, Math.max(1, diff));
  }

  function isDayComplete(key){
    var arr = state.progress[key];
    return !!arr && arr.length >= TASKS.length;
  }

  function computeStreak(){
    var streak = 0;
    var d = new Date();
    var key = toDateKey(d);
    if(!isDayComplete(key)){ d.setDate(d.getDate()-1); }
    while(true){
      key = toDateKey(d);
      if(isDayComplete(key)){ streak++; d.setDate(d.getDate()-1); } else break;
    }
    return streak;
  }

  function renderTop(){
    var dn = dayNumber();
    var streak = computeStreak();
    document.getElementById('dayChip').textContent =
      'ቀን ' + dn + '/180' + (streak > 0 ? '  🔥' + streak : '');
  }

  function renderPath(){
    var dn = dayNumber();
    var pct = Math.min(100, ((dn - 1) / 179) * 100);
    document.getElementById('pathFill').style.width = pct + '%';
    var currentMonth = Math.min(6, Math.ceil(dn / 30));
    var wrap = document.getElementById('pathNodes');
    wrap.innerHTML = '';
    MONTHS.forEach(function(m){
      var btn = document.createElement('button');
      btn.className = 'path-node' + (m.n < currentMonth ? ' done' : '') + (m.n === currentMonth ? ' current' : '');
      btn.innerHTML = '<span class="dot"></span><span>' + m.n + '</span>';
      btn.addEventListener('click', function(){
        openMonth = m.n;
        renderRoadmap();
        var el = document.getElementById('month-' + m.n);
        if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
      });
      wrap.appendChild(btn);
    });
  }

  function renderQuote(){
    var dn = dayNumber();
    document.getElementById('quoteText').textContent = QUOTES[(dn - 1) % QUOTES.length];
  }

  function renderTasks(){
    var key = toDateKey(new Date());
    var done = state.progress[key] || [];
    var list = document.getElementById('taskList');
    list.innerHTML = '';
    TASKS.forEach(function(t){
      var checked = done.indexOf(t.id) > -1;
      var li = document.createElement('li');
      li.className = 'task' + (checked ? ' checked' : '');
      li.innerHTML =
        '<span class="box">' + (checked ? '✓' : '') + '</span>' +
        '<span class="icon">' + t.icon + '</span>' +
        '<span class="info"><span class="label">' + t.label + '</span>' +
        '<div class="detail">' + t.detail + '</div></span>';
      li.addEventListener('click', function(){ toggleTask(t.id); });
      list.appendChild(li);
    });

    var status = document.getElementById('dayStatus');
    if(done.length >= TASKS.length){
      status.textContent = 'ዛሬ ሙሉ በሙሉ ጨርሰሃል! ☕ ጥሩ ስራ።';
      status.className = 'day-status complete';
    } else {
      status.textContent = done.length + ' / ' + TASKS.length + ' ዛሬ ተጠናቅቋል';
      status.className = 'day-status';
    }
  }

  function toggleTask(id){
    var key = toDateKey(new Date());
    var arr = state.progress[key] ? state.progress[key].slice() : [];
    var idx = arr.indexOf(id);
    if(idx > -1) arr.splice(idx, 1); else arr.push(id);
    state.progress[key] = arr;
    csSet('progress', JSON.stringify(state.progress));
    haptic();
    renderTasks();
    renderTop();
    renderPath();
  }

  function renderRoadmap(){
    var dn = dayNumber();
    var currentMonth = Math.min(6, Math.ceil(dn / 30));
    if(openMonth === null) openMonth = currentMonth;
    var wrap = document.getElementById('roadmap');
    wrap.innerHTML = '';
    MONTHS.forEach(function(m){
      var card = document.createElement('div');
      card.className = 'month-card' + (openMonth === m.n ? ' open' : '');
      card.id = 'month-' + m.n;

      var head = document.createElement('button');
      head.className = 'month-head';
      head.innerHTML =
        '<span class="month-num">0' + m.n + '</span>' +
        '<span class="mh-text"><div class="mh-title">' + m.title + '</div>' +
        '<div class="mh-range">' + m.range + (m.n === currentMonth ? ' · አሁን' : '') + '</div></span>' +
        '<span class="chevron">▾</span>';
      head.addEventListener('click', function(){
        openMonth = (openMonth === m.n) ? null : m.n;
        renderRoadmap();
      });

      var body = document.createElement('div');
      body.className = 'month-body';
      var inner = document.createElement('div');
      inner.className = 'month-body-inner';
      var ul = document.createElement('ul');
      m.focus.forEach(function(f){
        var li = document.createElement('li');
        li.textContent = '• ' + f;
        ul.appendChild(li);
      });
      var milestone = document.createElement('div');
      milestone.className = 'milestone';
      milestone.textContent = m.milestone;
      inner.appendChild(ul);
      inner.appendChild(milestone);
      body.appendChild(inner);

      card.appendChild(head);
      card.appendChild(body);
      wrap.appendChild(card);

      if(openMonth === m.n){
        requestAnimationFrame(function(){ body.style.maxHeight = body.scrollHeight + 'px'; });
      } else {
        body.style.maxHeight = '0px';
      }
    });
  }

  function renderSkillTabs(){
    var wrap = document.getElementById('skillTabs');
    wrap.innerHTML = '';
    Object.keys(SKILLS).forEach(function(key){
      var s = SKILLS[key];
      var btn = document.createElement('button');
      btn.className = 'skill-tab' + (activeSkill === key ? ' active' : '');
      btn.innerHTML = s.icon + ' ' + s.title;
      btn.addEventListener('click', function(){
        activeSkill = key;
        renderSkillTabs();
        renderSkillPanel();
      });
      wrap.appendChild(btn);
    });
  }

  function renderSkillPanel(){
    var s = SKILLS[activeSkill];
    var panel = document.getElementById('skillPanel');
    panel.innerHTML = '';

    var title = document.createElement('h2');
    title.className = 'panel-title';
    title.textContent = s.icon + ' ' + s.title;
    var sub = document.createElement('p');
    sub.className = 'panel-sub';
    sub.textContent = s.sub;

    var tipList = document.createElement('ul');
    tipList.className = 'tip-list';
    s.tips.forEach(function(tip, i){
      var li = document.createElement('li');
      li.innerHTML = '<span class="num">0' + (i + 1) + '</span><span>' + tip + '</span>';
      tipList.appendChild(li);
    });

    var resTitle = document.createElement('p');
    resTitle.className = 'res-title';
    resTitle.textContent = 'የሚረዱ መሳሪያዎች';

    var resList = document.createElement('div');
    resList.className = 'res-list';
    s.resources.forEach(function(r){
      var a = document.createElement('a');
      a.className = 'res-link';
      a.href = '#';
      a.innerHTML = '<span>' + r.name + '</span><span class="arrow">↗</span>';
      a.addEventListener('click', function(e){ e.preventDefault(); openLink(r.url); });
      resList.appendChild(a);
    });

    panel.appendChild(title);
    panel.appendChild(sub);
    panel.appendChild(tipList);
    panel.appendChild(resTitle);
    panel.appendChild(resList);
  }

  function switchView(name){
    document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
    document.getElementById('view-' + name).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-view') === name);
    });
  }

  function bindNav(){
    document.querySelectorAll('.nav-btn').forEach(function(b){
      b.addEventListener('click', function(){ switchView(b.getAttribute('data-view')); });
    });
  }

  function bindReset(){
    document.getElementById('resetBtn').addEventListener('click', function(){
      confirmDialog('እርግጠኛ ነህ? ሁሉም የእድገት መረጃ ይጠፋል እና ከቀን 1 ይጀምራል።', function(ok){
        if(!ok) return;
        state.progress = {};
        state.startDate = toDateKey(new Date());
        openMonth = null;
        csSet('progress', JSON.stringify(state.progress));
        csSet('startDate', state.startDate);
        renderAll();
      });
    });
  }

  function renderAll(){
    renderTop();
    renderPath();
    renderQuote();
    renderTasks();
    renderRoadmap();
    renderSkillTabs();
    renderSkillPanel();
  }

  function init(){
    csGet('startDate').then(function(sd){
      if(!sd){
        sd = toDateKey(new Date());
        csSet('startDate', sd);
      }
      state.startDate = sd;
      return csGet('progress');
    }).then(function(pr){
      try{ state.progress = pr ? JSON.parse(pr) : {}; }catch(e){ state.progress = {}; }
      bindNav();
      bindReset();
      renderAll();
    });
  }

  init();
})();
</script>
</body>
