<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OX Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { text-align: center; font-family: sans-serif; background: #1a1a1a; color: white; padding-top: 20px; }
        .grid { display: grid; grid-template-columns: repeat(3, 80px); gap: 5px; justify-content: center; }
        .cell { width: 80px; height: 80px; background: #333; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>OX Game</h2>
    <div class="grid" id="grid"></div>
    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let turn = "X";

        function render() {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";
            board.forEach((val, i) => {
                grid.innerHTML += `<div class="cell" onclick="makeMove(${i})">${val}</div>`;
            });
        }

        function checkWinner() {
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let line of lines) {
                const [a, b, c] = line;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    alert(board[a] + " አሸንፏል!");
                    board = ["", "", "", "", "", "", "", "", ""];
                    render();
                    return;
                }
            }
            if (!board.includes("")) { alert("አቻ!"); board = ["", "", "", "", "", "", "", "", ""]; render(); }
        }

        function makeMove(i) {
            if(board[i] === "") {
                board[i] = turn;
                render();
                checkWinner();
                turn = turn === "X" ? "O" : "X";
            }
        }
        render();
    </script>
</body>
</html>
