<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OX Game</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #1a1a1a; color: white; }
        .grid { display: grid; grid-template-columns: repeat(3, 80px); gap: 5px; justify-content: center; margin-top: 20px; }
        .cell { width: 80px; height: 80px; background: #333; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>OX Game</h2>
    <div class="grid" id="grid">
        <script>
            for(let i=0; i<9; i++) {
                document.write(`<div class="cell" onclick="this.innerText='X'"></div>`);
            }
        </script>
    </div>
</body>
</html>
