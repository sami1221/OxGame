<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OX Game</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #1a1a1a; color: white; padding-top: 20px; }
        
        .grid { 
            display: grid; grid-template-columns: repeat(3, 90px); gap: 10px; 
            justify-content: center; margin-top: 20px; background-color: #ff9933; 
            padding: 10px; border-radius: 15px; 
        }
        .cell { 
            width: 90px; height: 90px; background: #ffffff; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 40px; font-weight: bold; cursor: pointer; border-radius: 10px; 
        }
        .x-color { color: #ff4d4d; }
        .o-color { color: #4d94ff; }
        
        /* አኒሜሽን */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .win-anim { animation: pulse 0.5s infinite; border: 4px solid gold; }
        
        #ronaldo-container { margin-top: 20px; }
        #ronaldo-img { display: none; width: 150px; }
    </style>
</head>
<body>
    <h2>OX ጨዋታ</h2>
    <div id="status">የሚጫወተው: X</div>
    <div class="grid" id="grid"></div>
    <div id="ronaldo-container"><img id="ronaldo-img" src="https://media.tenor.com/images/3f191196426372134267f81491566455/tenor.gif"></div>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let turn = "X";

        function render() {
            const grid = document.getElementById("grid");
            document.getElementById("status").innerText = "የሚጫወተው: " + turn;
            grid.innerHTML = "";
            board.forEach((val, i) => {
                let color = val === "X" ? "x-color" : "o-color";
                grid.innerHTML += `<div class="cell ${color}" onclick="makeMove(${i})">${val}</div>`;
            });
        }

        function makeMove(i) {
            if(board[i] === "") {
                board[i] = turn;
                render();
                if(checkWinner()) return;
                turn = turn === "X" ? "O" : "X";
            }
        }

        function checkWinner() {
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let line of lines) {
                const [a, b, c] = line;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    // አኒሜሽን ማሳያ
                    const cells = document.getElementsByClassName("cell");
                    line.forEach(index => cells[index].classList.add("win-anim"));
                    document.getElementById("ronaldo-img").style.display = "inline-block";
                    
                    setTimeout(() => { alert(board[a] + " አሸንፏል! Siuuu!"); resetGame(); }, 500);
                    return true;
                }
            }
            if (!board.includes("")) { alert("አቻ!"); resetGame(); }
            return false;
        }

        function resetGame() { 
            board = ["", "", "", "", "", "", "", "", ""]; 
            turn = "X"; 
            document.getElementById("ronaldo-img").style.display = "none";
            render(); 
        }
        render();
    </script>
</body>
</html>
